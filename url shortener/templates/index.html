<!DOCTYPE html>
<html>

<head>

    <title>URL Shortener</title>

    <style>

        body{
            background:#1e1e2f;
            color:white;
            font-family:Arial;
            text-align:center;
            margin-top:100px;
        }

        input{
            width:400px;
            padding:12px;
            font-size:18px;
        }

        button{
            padding:12px 20px;
            background:green;
            color:white;
            border:none;
            font-size:18px;
            cursor:pointer;
        }

        a{
            color:yellow;
            font-size:22px;
        }

    </style>

</head>

<body>

<h1>Python URL Shortener</h1>

<form method="POST">

<input
type="text"
name="url"
placeholder="Enter Long URL"
required>

<button>Shorten</button>

</form>

{% if short_url %}

<h2>Your Short URL</h2>

<a href="{{short_url}}">
{{short_url}}
</a>

{% endif %}

</body>

</html>
